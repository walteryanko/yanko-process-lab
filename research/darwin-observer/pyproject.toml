[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ycs-darwin-observer"
version = "1.0.0"
description = "Partially observed scientific model-discrepancy laboratory for a six-state PG CSTR"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["darwin"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

