[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ycs-premonition-mpc"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "numba>=0.59", "matplotlib>=3.8"]
[tool.setuptools.packages.find]
include = ["premonition*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
