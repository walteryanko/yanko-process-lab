name: PG estimator benchmark
on:
  push:
    branches: [research/pg-estimator-benchmark-20261020]
    paths:
      - research/pg-estimator-benchmark/benchmark.py
      - research/pg-estimator-benchmark/test_science.py
      - research/pg-estimator-benchmark/PROTOCOL.json
      - .github/workflows/pg-estimator-benchmark.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r research/darwin-observer/requirements.txt
      - name: Verify model parity, derivatives, robustness and causality
        run: |
          set -o pipefail
          python -m unittest discover -s research/pg-estimator-benchmark -p 'test_*.py' -v 2>&1 | tee scientific-tests.log
      - name: Run the preregistered paired campaign
        run: |
          set -o pipefail
          python research/pg-estimator-benchmark/benchmark.py --workers 2 2>&1 | tee campaign.log
      - name: Preserve actual outputs on the research branch
        if: always()
        run: |
          if [ -f research/pg-estimator-benchmark/results/results.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/pg-estimator-benchmark/results/*.json research/pg-estimator-benchmark/results/*.csv research/pg-estimator-benchmark/results/*.md research/pg-estimator-benchmark/results/*.png
            if [ -f research/pg-estimator-benchmark/results/PG_Estimator_Benchmark_v0.1.zip ]; then
              git add -f research/pg-estimator-benchmark/results/PG_Estimator_Benchmark_v0.1.zip
            fi
            git diff --cached --quiet || git commit -m "Record executed paired PG estimator benchmark results"
            git push origin HEAD:research/pg-estimator-benchmark-20261020
          fi
      - name: Upload complete experiment and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PG-Estimator-Benchmark-v0.1
          retention-days: 3
          if-no-files-found: warn
          path: |
            research/pg-estimator-benchmark/results/
            scientific-tests.log
            campaign.log
