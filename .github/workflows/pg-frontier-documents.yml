name: PG Frontier Documents and Delivery
on:
  push:
    branches: [research/pg-information-control-frontier-20261020]
    paths:
      - research/pg_information_control_frontier/reproducibility/BUILD_REQUEST*.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific and document dependencies
        run: |
          python -m pip install -r research/pg_information_control_frontier/requirements.txt mpmath==1.3.0
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-extra texlive-lang-portuguese lmodern poppler-utils
      - name: Verify syntax, independent metrics, supplementary proofs and compile documents
        run: |
          set -o pipefail
          python -m compileall -q research/pg_information_control_frontier/src
          python research/pg_information_control_frontier/src/reporting.py 2>&1 | tee research/pg_information_control_frontier/results/document_execution.log
      - name: Preserve created artifacts and failure logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/pg_information_control_frontier/results
          if [ -d research/pg_information_control_frontier/deliverables ]; then
            git add -f research/pg_information_control_frontier/deliverables
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Preserve PG metric audit, compiled manuscripts and partial delivery"
            git pull --rebase origin research/pg-information-control-frontier-20261020
            git push origin HEAD:research/pg-information-control-frontier-20261020
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PG-Frontier-Partial-Research-Package
          retention-days: 14
          path: |
            research/pg_information_control_frontier/deliverables/
            research/pg_information_control_frontier/results/document_execution.log
