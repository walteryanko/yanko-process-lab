name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run demo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/nake/requirements.txt
      - run: python -m unittest discover -s research/nake -p 'test_*.py' -v
      - run: python -m pip install -r research/blackbox/requirements.txt
      - run: python -m unittest discover -s research/blackbox -p 'test_*.py' -v
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
