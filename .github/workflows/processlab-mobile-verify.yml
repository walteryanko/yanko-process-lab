name: ProcessLab exact ARM64 APK verification
on:
  push:
    branches: ['work/mobile-release-verification-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: 1cc2c3c5c942eaa61dc3ca3d2f1a230235ef5f62
      SOURCE_RUN: '38438123965'
      PROCESSLAB_APK: ${{ github.workspace }}/apps/mobile/release/YCS-ProcessLab-Mobile-0.1.0-beta.1-arm64-evaluation.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert unchanged packaged application and scientific sources
        run: |
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- apps/mobile/App.tsx apps/mobile/src apps/mobile/package.json apps/mobile/package-lock.json apps/mobile/app.json apps/mobile/plugins packages/scientific-core lib/simulation
      - uses: actions/download-artifact@v4
        with:
          name: YCS-ProcessLab-Mobile-1cc2c3c5c942eaa61dc3ca3d2f1a230235ef5f62
          path: apps/mobile/release
          github-token: ${{ github.token }}
          run-id: 38438123965
      - name: Verify exact existing APK integrity and signature
        working-directory: apps/mobile
        run: |
          sha256sum -c release/SHA256SUMS.txt
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$PROCESSLAB_APK" > release/signature.txt
          rm -f release/device-qa.json release/device-science.json release/failure.png release/failure-ui.xml release/android-logcat.txt
          printf '{"source_commit":"%s","source_run":"%s","verification_commit":"%s","verification_run":"%s","apk_arch":"arm64-v8a","emulator_arch":"x86_64 with observed libndk_translation"}\n' "$SOURCE_COMMIT" "$SOURCE_RUN" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release/verification-info.json
      - name: Recheck all scientific gates on identical sources
        run: |
          npm test 2>&1 | tee apps/mobile/release/original-science-tests.txt
          node --test packages/scientific-core/tests/*.test.mjs 2>&1 | tee apps/mobile/release/mobile-science-tests.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise delivered ARM64 APK offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 apps/mobile/scripts/device_qa.py
      - name: Publish exact APK and complete device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProcessLab-ARM64-verified-${{ github.sha }}
          path: apps/mobile/release/
          retention-days: 3
          if-no-files-found: error
